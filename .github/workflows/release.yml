name: release

# Runs when a tag vX.Y.Z is pushed: tests, then the binaries on the GitHub
# release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/admin/package-lock.json
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
      - name: admin page tests
        working-directory: web/admin
        run: |
          npm ci --no-audit --no-fund
          npm test
      # The binaries embed internal/server/adminui as committed: it must
      # match a fresh build of web/admin.
      - name: admin page build is up to date
        run: |
          (cd web/admin && npm run build)
          if ! git diff --quiet -- internal/server/adminui || [ -n "$(git status --porcelain -- internal/server/adminui)" ]; then
            echo "internal/server/adminui is stale: run 'make ui' and commit it"; git status --short -- internal/server/adminui; exit 1
          fi

  binaries:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

