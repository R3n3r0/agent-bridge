version: 2

project_name: agent-bridge

before:
  hooks:
    - go mod tidy

builds:
  - id: agent-bridge
    main: ./cmd/agent-bridge
    binary: agent-bridge
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/r3n3r0/agent-bridge/internal/version.Version={{ .Version }}
      - -X github.com/r3n3r0/agent-bridge/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/r3n3r0/agent-bridge/internal/version.Date={{ .Date }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - README.it.md
      - LICENSE
      - CHANGELOG.md
      - docs/*
      - examples/**/*

checksum:
  name_template: checksums.txt

release:
  # Tags with a suffix (v1.2.0-rc.1) are published as pre-releases.
  prerelease: auto
  footer: |
    ## Docker

    ```sh
    docker pull paolor/agent-bridge:{{ .Version }}
    ```

    Or set `AGENT_BRIDGE_IMAGE=paolor/agent-bridge:{{ .Version }}` in `.env` and run `make pull up`.

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
