<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-bridge logins</title>
<style>
:root { --bg:#f6f6f3; --fg:#1c1c1a; --muted:#6a6a64; --card:#fff; --line:#e2e2dc; --soft:#f0f0ec;
  --ok:#1e7a3a; --okbg:#e8f4ec; --bad:#a3302a; --badbg:#f8eceb; --run:#8a5a00; --runbg:#fbf3e2; --acc:#2852a8; --accfg:#fff; }
@media (prefers-color-scheme: dark) { :root { --bg:#141413; --fg:#ececE8; --muted:#a3a39c; --card:#1e1e1c; --line:#34342f; --soft:#262623;
  --ok:#62c784; --okbg:#1c2b21; --bad:#e57a72; --badbg:#2e1f1d; --run:#e3b65c; --runbg:#2c2618; --acc:#8fb0f5; --accfg:#111; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width:780px; margin:0 auto; padding:28px 16px 56px; }
h1 { font-size:22px; margin:0 0 4px; }
.lead { color:var(--muted); margin:0 0 20px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin:0 0 14px; }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.head { justify-content:space-between; }
.title { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.name { font-weight:650; font-size:17px; }
.tag { font-size:12px; color:var(--muted); border:1px solid var(--line); border-radius:6px; padding:1px 6px; }
.badge { font-size:13px; padding:2px 10px; border-radius:99px; font-weight:550; }
.badge.ok { color:var(--ok); background:var(--okbg); }
.badge.bad { color:var(--bad); background:var(--badbg); }
.badge.run { color:var(--run); background:var(--runbg); }
.badge.none { color:var(--muted); background:var(--soft); }
.detail { color:var(--muted); font-size:13px; margin-top:4px; }
button, a.btn { font:inherit; padding:7px 14px; border-radius:8px; border:1px solid var(--line); background:var(--soft); color:var(--fg); cursor:pointer; text-decoration:none; display:inline-block; }
button.primary, a.btn.primary { background:var(--acc); border-color:var(--acc); color:var(--accfg); }
button:disabled { opacity:.5; cursor:default; }
input { font:inherit; padding:7px 10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--fg); flex:1 1 220px; min-width:0; }
ol.steps { margin:14px 0 6px; padding:0; list-style:none; counter-reset:s; }
ol.steps > li { counter-increment:s; position:relative; padding:0 0 14px 36px; }
ol.steps > li::before { content:counter(s); position:absolute; left:0; top:1px; width:24px; height:24px; border-radius:50%;
  background:var(--soft); border:1px solid var(--line); font-size:13px; font-weight:600; display:flex; align-items:center; justify-content:center; }
.step-title { font-weight:550; margin-bottom:6px; }
.code { font:600 22px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing:.06em; padding:8px 14px; border-radius:8px; background:var(--soft); border:1px dashed var(--line); }
details { margin-top:6px; }
summary { cursor:pointer; color:var(--muted); font-size:13px; }
pre { white-space:pre-wrap; word-break:break-all; background:var(--soft); border:1px solid var(--line); border-radius:8px; padding:10px; margin:8px 0 0; max-height:240px; overflow:auto; font-size:12.5px; }
.outcome { margin-top:10px; font-size:14px; }
.outcome.ok { color:var(--ok); } .outcome.bad { color:var(--bad); }
.err { color:var(--bad); font-size:14px; min-height:1.5em; margin-top:6px; }
.hint { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>agent-bridge logins</h1>
  <p class="lead">Log in to the CLIs on this server with their official login. The credentials stay with each CLI; the bridge never reads them.</p>
  <div class="card">
    <div class="row">
      <input id="key" type="password" placeholder="Bridge API key (AGENT_BRIDGE_API_KEY)" autocomplete="off">
      <button id="save" class="primary">Use key</button>
      <button id="refresh">Refresh</button>
    </div>
    <div class="err" id="err"></div>
  </div>
  <div id="clis"></div>
</main>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
let key = "";
try { key = sessionStorage.getItem("ab-key") || ""; } catch (e) {}
$("#key").value = key;
let timer = null, seq = 0;
const openDetails = new Set();

async function api(method, path, body) {
  const h = { "X-Agent-Bridge-Admin": "1" };
  if (key) h["Authorization"] = "Bearer " + key;
  if (body) h["Content-Type"] = "application/json";
  const r = await fetch(path, { method, headers: h, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 204) return null;
  const j = await r.json().catch(() => ({}));
  if (!r.ok) {
    const e = new Error((j.error && j.error.message) || r.statusText);
    e.status = r.status;
    throw e;
  }
  return j;
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function badge(c) {
  if (c.flow && c.flow.state === "running") return el("span", "badge run", "login in progress");
  if (!c.installed) return el("span", "badge bad", "not installed");
  if (c.logged_in === true) return el("span", "badge ok", "logged in");
  if (c.logged_in === false) return el("span", "badge bad", "not logged in");
  return el("span", "badge none", "unknown");
}

function step(title, ...content) {
  const li = el("li");
  li.append(el("div", "step-title", title), ...content);
  return li;
}

function copyButton(text) {
  const b = el("button", "", "Copy");
  b.onclick = async () => {
    try { await navigator.clipboard.writeText(text); b.textContent = "Copied"; } catch (e) { b.textContent = "Select and copy"; }
    setTimeout(() => (b.textContent = "Copy"), 1500);
  };
  return b;
}

function flowView(c) {
  const f = c.flow, box = el("div");
  const running = f.state === "running";
  if (running) {
    const steps = el("ol", "steps");
    if (f.urls.length) {
      const a = el("a", "btn primary", "Open sign-in page ↗");
      a.href = f.urls[0]; a.target = "_blank"; a.rel = "noopener noreferrer";
      steps.append(step("Open the sign-in page and log in", a));
    }
    for (const code of f.codes) {
      const row = el("div", "row");
      row.append(el("span", "code", code), copyButton(code));
      steps.append(step("Enter this one-time code if the page asks for it", row));
    }
    if (f.accepts_input) {
      const row = el("div", "row");
      const inp = el("input");
      inp.placeholder = "Code shown after signing in";
      inp.autocomplete = "off";
      const send = el("button", "primary", "Send code");
      const submit = () => inp.value.trim() && act(() => api("POST", "/admin/api/logins/" + c.cli + "/input", { text: inp.value.trim() }));
      send.onclick = submit;
      inp.onkeydown = (e) => { if (e.key === "Enter") submit(); };
      row.append(inp, send);
      steps.append(step("Paste the code the sign-in page gives you", row));
    }
    steps.append(step("Wait here: the state updates by itself", el("div", "hint", "Started " + new Date(f.started_at).toLocaleTimeString())));
    box.append(steps);
    const cancel = el("button", "", "Cancel login");
    cancel.onclick = () => act(() => api("DELETE", "/admin/api/logins/" + c.cli));
    box.append(cancel);
  } else {
    const ok = f.state === "succeeded";
    box.append(el("div", "outcome " + (ok ? "ok" : "bad"),
      ok ? "Login completed." : f.state === "canceled" ? "Login canceled." : "Login failed: see the CLI output below."));
  }
  const d = el("details");
  d.open = openDetails.has(c.cli) || (!running && f.state === "failed");
  d.ontoggle = () => (d.open ? openDetails.add(c.cli) : openDetails.delete(c.cli));
  d.append(el("summary", "", "CLI output"), el("pre", "", f.output || "(waiting for the CLI…)"));
  box.append(d);
  return box;
}

function render(data) {
  const root = $("#clis");
  root.textContent = "";
  let running = false;
  for (const c of data.clis) {
    const card = el("div", "card");
    const head = el("div", "row head");
    const title = el("div", "title");
    title.append(el("span", "name", c.cli));
    if (c.cli === data.backend) title.append(el("span", "tag", "this server's backend"));
    title.append(badge(c));
    const busy = c.flow && c.flow.state === "running";
    if (busy) running = true;
    const start = el("button", c.logged_in ? "" : "primary", c.logged_in ? "Log in again" : "Log in");
    start.disabled = !c.installed || busy;
    start.onclick = () => act(() => api("POST", "/admin/api/logins/" + c.cli));
    head.append(title, start);
    card.append(head);
    if (c.detail && c.detail.toLowerCase().replace(/\.$/, "") !== badge(c).textContent) card.append(el("div", "detail", c.detail));
    if (c.flow) card.append(flowView(c));
    root.append(card);
  }
  clearTimeout(timer);
  if (running) timer = setTimeout(load, 2000);
}

async function load() {
  const mine = ++seq;
  try {
    const data = await api("GET", "/admin/api/logins");
    if (mine !== seq) return;
    render(data);
    $("#err").textContent = "";
  } catch (e) {
    if (mine !== seq) return;
    $("#clis").textContent = "";
    $("#err").textContent = e.status === 401 ? "Enter the bridge API key to continue." : e.message;
  }
}

async function act(fn) {
  try { await fn(); $("#err").textContent = ""; } catch (e) { $("#err").textContent = e.message; }
  load();
}

$("#save").onclick = () => {
  key = $("#key").value.trim();
  try { sessionStorage.setItem("ab-key", key); } catch (e) {}
  load();
};
$("#key").onkeydown = (e) => { if (e.key === "Enter") $("#save").click(); };
$("#refresh").onclick = load;
load();
</script>
</body>
</html>
