<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-bridge logins</title>
<style>
:root { --bg:#f7f7f5; --fg:#1d1d1b; --muted:#6b6b66; --card:#fff; --line:#e3e3de; --ok:#1f7a3a; --bad:#a3302a; --acc:#2852a8; }
@media (prefers-color-scheme: dark) { :root { --bg:#151514; --fg:#ecece8; --muted:#a2a29b; --card:#1f1f1d; --line:#33332f; --ok:#5cc47c; --bad:#e2766f; --acc:#8fb0f5; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; }
main { max-width:860px; margin:0 auto; padding:24px 16px 48px; }
h1 { font-size:22px; margin:0 0 4px; }
p.lead { color:var(--muted); margin:0 0 20px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin:0 0 16px; }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.name { font-weight:600; font-size:17px; }
.badge { font-size:13px; padding:2px 8px; border-radius:99px; border:1px solid var(--line); color:var(--muted); }
.badge.ok { color:var(--ok); border-color:var(--ok); }
.badge.bad { color:var(--bad); border-color:var(--bad); }
.detail { color:var(--muted); font-size:13px; flex:1 1 200px; }
button { font:inherit; padding:6px 14px; border-radius:7px; border:1px solid var(--line); background:var(--bg); color:var(--fg); cursor:pointer; }
button.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
button:disabled { opacity:.5; cursor:default; }
input { font:inherit; padding:6px 10px; border-radius:7px; border:1px solid var(--line); background:var(--bg); color:var(--fg); flex:1 1 240px; min-width:0; }
pre { white-space:pre-wrap; word-break:break-all; background:var(--bg); border:1px solid var(--line); border-radius:7px; padding:10px; margin:12px 0 8px; max-height:260px; overflow:auto; font-size:13px; }
.links a { display:block; color:var(--acc); word-break:break-all; margin:4px 0; }
.err { color:var(--bad); font-size:14px; min-height:1.5em; }
</style>
</head>
<body>
<main>
  <h1>agent-bridge logins</h1>
  <p class="lead">Runs each CLI's official login on this server. Open the link, sign in, and paste the code back if the CLI asks for one. The credentials stay with the CLI; the bridge never reads them.</p>
  <div class="card">
    <div class="row">
      <input id="key" type="password" placeholder="Bridge API key (AGENT_BRIDGE_API_KEY), if set" autocomplete="off">
      <button id="save">Use key</button>
      <button id="refresh">Refresh</button>
    </div>
    <div class="err" id="err"></div>
  </div>
  <div id="clis"></div>
</main>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
let key = "";
try { key = sessionStorage.getItem("ab-key") || ""; } catch (e) {}
$("#key").value = key;
let timer = null;

async function api(method, path, body) {
  const h = { "X-Agent-Bridge-Admin": "1" };
  if (key) h["Authorization"] = "Bearer " + key;
  if (body) h["Content-Type"] = "application/json";
  const r = await fetch(path, { method, headers: h, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 204) return null;
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error((j.error && j.error.message) || r.statusText);
  return j;
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function render(data) {
  const root = $("#clis");
  root.textContent = "";
  let running = false;
  for (const c of data.clis) {
    const card = el("div", "card");
    const head = el("div", "row");
    head.append(el("span", "name", c.cli + (c.cli === data.backend ? " (this server's backend)" : "")));
    let badge = el("span", "badge", "unknown");
    if (!c.installed) badge = el("span", "badge bad", "not installed");
    else if (c.logged_in === true) badge = el("span", "badge ok", "logged in");
    else if (c.logged_in === false) badge = el("span", "badge bad", "not logged in");
    head.append(badge, el("span", "detail", c.detail || ""));
    const start = el("button", "primary", c.logged_in ? "Log in again" : "Log in");
    start.disabled = !c.installed || (c.flow && c.flow.state === "running");
    start.onclick = () => act(() => api("POST", "/admin/api/logins/" + c.cli));
    head.append(start);
    card.append(head);
    const f = c.flow;
    if (f) {
      if (f.state === "running") running = true;
      card.append(el("div", "detail", "Login " + f.state + " (started " + new Date(f.started_at).toLocaleTimeString() + ")"));
      if (f.urls.length) {
        const links = el("div", "links");
        for (const u of f.urls) {
          const a = el("a", "", u);
          a.href = u; a.target = "_blank"; a.rel = "noopener noreferrer";
          links.append(a);
        }
        card.append(links);
      }
      card.append(el("pre", "", f.output || "(waiting for the CLI…)"));
      if (f.state === "running") {
        const row = el("div", "row");
        if (f.accepts_input) {
          const inp = el("input");
          inp.placeholder = "Paste the code shown after signing in";
          inp.autocomplete = "off";
          const send = el("button", "primary", "Send code");
          send.onclick = () => act(() => api("POST", "/admin/api/logins/" + c.cli + "/input", { text: inp.value.trim() }));
          row.append(inp, send);
        }
        const cancel = el("button", "", "Cancel");
        cancel.onclick = () => act(() => api("DELETE", "/admin/api/logins/" + c.cli));
        row.append(cancel);
        card.append(row);
      }
    }
    root.append(card);
  }
  clearTimeout(timer);
  if (running) timer = setTimeout(load, 2000);
}

async function load() {
  try {
    render(await api("GET", "/admin/api/logins"));
    $("#err").textContent = "";
  } catch (e) {
    $("#err").textContent = e.message;
  }
}

async function act(fn) {
  try { await fn(); $("#err").textContent = ""; } catch (e) { $("#err").textContent = e.message; }
  load();
}

$("#save").onclick = () => {
  key = $("#key").value.trim();
  try { sessionStorage.setItem("ab-key", key); } catch (e) {}
  load();
};
$("#refresh").onclick = load;
load();
</script>
</body>
</html>
